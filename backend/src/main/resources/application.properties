spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=TRACE

application.api.jwt-secret-key=${SECRET_KEY:5447bfe15747feb10cb6aa161ede9b5bbad908f1af0eedd5ef3b77626ccd2eeb}

# Configuration CORS
application.cors.allowed-origins=http://localhost:4200,http://localhost:5173,http://localhost:8080}
application.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
application.cors.allowed-headers=*
application.cors.exposed-headers=*
application.cors.allow-credentials=true
