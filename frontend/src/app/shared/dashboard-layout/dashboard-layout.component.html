<mat-sidenav-container class="dash-container">
  <mat-sidenav mode="side" opened class="dash-sidenav">
    <div class="dash-brand">
      <span class="dash-brand-name">{{ appName }}</span>
    </div>

    <mat-nav-list class="dash-nav">
      <a
        mat-list-item
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="dash-nav-item--active"
        class="dash-nav-item">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>
          {{ item.label }}
          <span
            *ngIf="item.badgeCount"
            class="dash-nav-badge">{{ item.badgeCount }}</span>
        </span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="dash-content-area">
    <mat-toolbar class="dash-toolbar">
      <span class="dash-toolbar-spacer"></span>

      <button mat-button class="dash-user-trigger" [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="dash-user-name">{{ userName }}</span>
        <mat-icon class="dash-user-chevron">expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item routerLink="/parametres">
          <mat-icon>settings</mat-icon>
          <span>Paramètres</span>
        </button>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Se déconnecter</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="dash-page">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
