<div class="auth-page" [class.auth-page--green-dark]="background === 'green-dark'" [class.auth-page--green-light]="background === 'green-light'">
  <mat-card class="auth-card" [style.max-width]="cardMaxWidth">
    <div class="auth-badge" [class.auth-badge--green-dark]="background === 'green-dark'" [class.auth-badge--green-light]="background === 'green-light'">
      <mat-icon>{{ icon }}</mat-icon>
    </div>

    <h1 class="auth-title">{{ title }}</h1>
    <p class="auth-subtitle" *ngIf="subtitle">{{ subtitle }}</p>

    <div class="auth-form-slot">
      <ng-content></ng-content>
    </div>
  </mat-card>
</div>
